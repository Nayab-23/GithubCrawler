<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robotics Crawler Dashboard</title>
    <style>
      :root {
        --bg: #040706;
        --panel: #09100d;
        --panel-2: #0e1713;
        --line: rgba(110, 231, 183, 0.14);
        --text: #e5fff4;
        --muted: #8fb9a7;
        --accent: #34d399;
        --green: #34d399;
        --yellow: #fbbf24;
        --grey: #94a3b8;
        --shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--text);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        background:
          linear-gradient(rgba(52, 211, 153, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(52, 211, 153, 0.04) 1px, transparent 1px),
          radial-gradient(circle at top, rgba(52, 211, 153, 0.12), transparent 32%),
          var(--bg);
        background-size: 28px 28px, 28px 28px, auto, auto;
      }

      a {
        color: #9ff5d1;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .shell {
        width: min(1480px, calc(100% - 24px));
        margin: 18px auto 28px;
      }

      .panel,
      .header,
      .stat-card {
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.03),
          rgba(255, 255, 255, 0.01)
        );
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
      }

      .header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        padding: 20px 22px;
        margin-bottom: 14px;
      }

      .title {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      .title p,
      .status,
      .muted {
        color: var(--muted);
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .status {
        font-size: 12px;
      }

      .export-form {
        margin: 0;
      }

      .button,
      .filter-select,
      .filter-input {
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        border-radius: 10px;
        padding: 10px 12px;
        font: inherit;
      }

      .button {
        cursor: pointer;
      }

      .button:hover {
        border-color: rgba(52, 211, 153, 0.4);
        background: rgba(52, 211, 153, 0.12);
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 14px;
      }

      .stat-card {
        padding: 16px;
        min-height: 96px;
      }

      .stat-label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .stat-value {
        margin-top: 12px;
        font-size: 30px;
        font-weight: 700;
      }

      .stat-card.p1 .stat-value {
        color: #8ef0c9;
      }

      .stat-card.p2 .stat-value {
        color: #ffd978;
      }

      .stat-card.p3 .stat-value {
        color: #d6deea;
      }

      .panel {
        padding: 16px;
        margin-bottom: 14px;
      }

      .filters {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }

      .filter-select,
      .filter-input {
        min-width: 180px;
      }

      .filter-input {
        flex: 1 1 260px;
      }

      .table-wrap {
        overflow: auto;
        border-radius: 12px;
        border: 1px solid var(--line);
        margin-top: 14px;
        max-height: 72vh;
        background: rgba(0, 0, 0, 0.18);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 1220px;
      }

      th,
      td {
        text-align: left;
        padding: 12px 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
        font-size: 13px;
      }

      th {
        position: sticky;
        top: 0;
        z-index: 2;
        background: var(--panel-2);
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 11px;
      }

      tbody tr:hover {
        background: rgba(255, 255, 255, 0.03);
      }

      tbody tr.p1 {
        background: rgba(52, 211, 153, 0.08);
      }

      tbody tr.p2 {
        background: rgba(251, 191, 36, 0.09);
      }

      tbody tr.p3 {
        background: rgba(148, 163, 184, 0.06);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 40px;
        padding: 5px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
      }

      .badge.p1 {
        background: rgba(52, 211, 153, 0.18);
        color: #8ef0c9;
      }

      .badge.p2 {
        background: rgba(251, 191, 36, 0.16);
        color: #ffd978;
      }

      .badge.p3 {
        background: rgba(148, 163, 184, 0.14);
        color: #d6deea;
      }

      .email-list,
      .link-stack {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .mail-link,
      .external-link {
        display: inline-flex;
        width: fit-content;
        padding: 4px 8px;
        border-radius: 999px;
        border: 1px solid rgba(52, 211, 153, 0.16);
        background: rgba(52, 211, 153, 0.08);
      }

      .empty-state {
        padding: 24px 12px;
        text-align: center;
        color: var(--muted);
      }

      @media (max-width: 1200px) {
        .stats-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 760px) {
        .shell {
          width: min(100% - 16px, 1480px);
        }

        .header {
          flex-direction: column;
          align-items: flex-start;
        }

        .stats-grid {
          grid-template-columns: 1fr;
        }

        .filters {
          flex-direction: column;
          align-items: stretch;
        }

        .filter-select,
        .filter-input {
          width: 100%;
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <section class="header">
        <div class="title">
          <h1>Robotics Crawler Dashboard</h1>
          <p>Live monitor for robotics lead discovery and enrichment.</p>
        </div>
        <div class="header-actions">
          <div class="status">
            Refresh every {{ refresh_seconds }}s
            <span id="last-refresh" class="muted"></span>
          </div>
          <form class="export-form" method="post" action="/api/export">
            <button class="button" type="submit">Export CSV</button>
          </form>
        </div>
      </section>

      <section class="stats-grid">
        <article class="stat-card">
          <div class="stat-label">Total Teams</div>
          <div id="stat-total" class="stat-value">0</div>
        </article>
        <article class="stat-card p1">
          <div class="stat-label">P1</div>
          <div id="stat-p1" class="stat-value">0</div>
        </article>
        <article class="stat-card p2">
          <div class="stat-label">P2</div>
          <div id="stat-p2" class="stat-value">0</div>
        </article>
        <article class="stat-card p3">
          <div class="stat-label">P3</div>
          <div id="stat-p3" class="stat-value">0</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">Emails Found</div>
          <div id="stat-emails" class="stat-value">0</div>
        </article>
      </section>

      <section class="panel">
        <div class="filters">
          <select id="priority-filter" class="filter-select">
            <option value="">All Priorities</option>
            <option value="P1">P1</option>
            <option value="P2">P2</option>
            <option value="P3">P3</option>
          </select>

          <select id="country-filter" class="filter-select">
            <option value="">All Countries</option>
          </select>

          <input
            id="search-filter"
            class="filter-input"
            type="search"
            placeholder="Search by team name, number, or school"
          />
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Priority</th>
                <th>Team Number</th>
                <th>Team Name</th>
                <th>School</th>
                <th>City/State</th>
                <th>Country</th>
                <th>Emails</th>
                <th>GitHub</th>
                <th>Website</th>
                <th>Last Active</th>
                <th>Notes</th>
              </tr>
            </thead>
            <tbody id="teams-body"></tbody>
          </table>
        </div>
      </section>
    </div>

    <script>
      const REFRESH_MS = {{ refresh_seconds|int * 1000 }};
      const state = {
        teams: {{ teams|tojson }},
        stats: {{ stats|tojson }},
      };

      const teamsBody = document.getElementById("teams-body");
      const priorityFilter = document.getElementById("priority-filter");
      const countryFilter = document.getElementById("country-filter");
      const searchFilter = document.getElementById("search-filter");
      const lastRefresh = document.getElementById("last-refresh");

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function formatUrlLabel(url) {
        if (!url) {
          return "";
        }

        try {
          const hostname = new URL(url).hostname.replace(/^www\./, "");
          return hostname || "Open";
        } catch (_) {
          return "Open";
        }
      }

      function renderStats() {
        document.getElementById("stat-total").textContent = state.stats.total ?? 0;
        document.getElementById("stat-p1").textContent = state.stats.P1 ?? 0;
        document.getElementById("stat-p2").textContent = state.stats.P2 ?? 0;
        document.getElementById("stat-p3").textContent = state.stats.P3 ?? 0;
        document.getElementById("stat-emails").textContent =
          state.stats.emails_found ?? 0;
      }

      function renderCountryOptions() {
        const selected = countryFilter.value;
        const countries = [...new Set(state.teams.map((team) => team.country).filter(Boolean))].sort();
        countryFilter.innerHTML = '<option value="">All Countries</option>';

        for (const country of countries) {
          const option = document.createElement("option");
          option.value = country;
          option.textContent = country;
          countryFilter.appendChild(option);
        }

        countryFilter.value = countries.includes(selected) ? selected : "";
      }

      function getFilteredTeams() {
        const priority = priorityFilter.value;
        const country = countryFilter.value;
        const search = searchFilter.value.trim().toLowerCase();

        return state.teams.filter((team) => {
          if (priority && team.priority !== priority) {
            return false;
          }
          if (country && team.country !== country) {
            return false;
          }
          if (!search) {
            return true;
          }

          const haystack = [
            team.team_number_display,
            team.team_number,
            team.team_name,
            team.school_name,
            team.notes,
          ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();

          return haystack.includes(search);
        });
      }

      function renderTeams() {
        const teams = getFilteredTeams();

        if (teams.length === 0) {
          teamsBody.innerHTML =
            '<tr><td class="empty-state" colspan="11">No teams match the current filters.</td></tr>';
          return;
        }

        teamsBody.innerHTML = teams
          .map((team) => {
            const emails = (team.emails || [])
              .map(
                (email) =>
                  `<a class="mail-link" href="mailto:${encodeURIComponent(email)}">${escapeHtml(email)}</a>`
              )
              .join("");

            const github = team.github_org_url
              ? `<a class="external-link" href="${escapeHtml(team.github_org_url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(formatUrlLabel(team.github_org_url))}</a>`
              : '<span class="muted">-</span>';

            const website = team.website
              ? `<a class="external-link" href="${escapeHtml(team.website)}" target="_blank" rel="noopener noreferrer">${escapeHtml(formatUrlLabel(team.website))}</a>`
              : '<span class="muted">-</span>';

            return `
              <tr class="${escapeHtml((team.priority || "P3").toLowerCase())}">
                <td><span class="badge ${escapeHtml((team.priority || "P3").toLowerCase())}">${escapeHtml(team.priority || "P3")}</span></td>
                <td>${escapeHtml(team.team_number_display || team.team_number || "-")}</td>
                <td>${escapeHtml(team.team_name || "-")}</td>
                <td>${escapeHtml(team.school_name || "-")}</td>
                <td>${escapeHtml(team.city_state || "-")}</td>
                <td>${escapeHtml(team.country || "-")}</td>
                <td><div class="email-list">${emails || '<span class="muted">-</span>'}</div></td>
                <td><div class="link-stack">${github}</div></td>
                <td><div class="link-stack">${website}</div></td>
                <td>${escapeHtml(team.last_active_year || "-")}</td>
                <td>${escapeHtml(team.notes || "-")}</td>
              </tr>
            `;
          })
          .join("");
      }

      function setRefreshLabel() {
        lastRefresh.textContent = `| last refresh ${new Date().toLocaleTimeString()}`;
      }

      async function refreshDashboard() {
        try {
          const [statsResponse, teamsResponse] = await Promise.all([
            fetch("/api/stats", { cache: "no-store" }),
            fetch("/api/teams", { cache: "no-store" }),
          ]);

          if (!statsResponse.ok || !teamsResponse.ok) {
            throw new Error("Failed to refresh dashboard");
          }

          state.stats = await statsResponse.json();
          state.teams = await teamsResponse.json();
          renderStats();
          renderCountryOptions();
          renderTeams();
          setRefreshLabel();
        } catch (_) {
          setRefreshLabel();
        }
      }

      priorityFilter.addEventListener("change", renderTeams);
      countryFilter.addEventListener("change", renderTeams);
      searchFilter.addEventListener("input", renderTeams);

      renderStats();
      renderCountryOptions();
      renderTeams();
      setRefreshLabel();
      setInterval(refreshDashboard, REFRESH_MS);
    </script>
  </body>
</html>
